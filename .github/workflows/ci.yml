name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: psx
          POSTGRES_PASSWORD: psx
          POSTGRES_DB: psx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psx -d psx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://psx:psx@localhost:5432/psx
          DATABASE_URL_SYNC: postgresql://psx:psx@localhost:5432/psx
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://psx:psx@localhost:5432/psx
          DATABASE_URL_SYNC: postgresql://psx:psx@localhost:5432/psx
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
